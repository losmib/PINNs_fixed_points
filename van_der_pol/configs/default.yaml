#################################
# Version & seed settings
#################################

version: "default"    # is used for log-folder name
seed: 1               # data sampling and weights initialization

#################################
# System settings
#################################

# mu
mu: 1.0

# Initial Angle (in degrees)
x0: 0.5
# Initial Velocity
x_t0: 0.0

# Simulation Length
T: 15.0

#################################
# Data settings (sampled anewly at each epoch)
#################################

N_col: 1024

#################################
# PhysicsInformedNN settings
#################################

N_hidden: 4
N_neurons: 50
activation: 'swish'

N_epochs: 25000
learning_rate: 0.001
decay_rate: 1.0

#################################
# Callback and Log settings
#################################

freq_log: 100
freq_print: 1000
keys_print: ['loss_P', 'loss_IC']
freq_save: 1000

#################################
# Regularization settings
#################################
regularization: "reg_derivative_unstable_fp"
reg_coeff: 1.0
reg_decay: "linear"
reg_epochs: 0.5