#################################
# Version & seed settings
#################################

version: "default"    # is used for log-folder name
seed: 1               # data sampling and weights initialization

#################################
# System settings
#################################

# Coefficients
A: 1
B: 2.5

# Initial Condition
x0: 1.0
y0: 2.0
# Simulation Length
T: 15.0

#################################
# Data settings (sampled anewly at each epoch)
#################################

N_col: 1024

#################################
# PhysicsInformedNN settings
#################################

N_hidden: 4
N_neurons: 50
activation: 'swish'

#################################
# Training settings
#################################

N_epochs: 25000
learning_rate: 0.001
decay_rate: 1.0

#################################
# Callback and Log settings
#################################

freq_log: 100
freq_print: 1000
keys_print: ['loss']
freq_save: 100

#################################
# Regularization settings
#################################

regularization: "reg_derivative"
reg_coeff: 1.0
reg_decay: "linear"
reg_epochs: 0.5